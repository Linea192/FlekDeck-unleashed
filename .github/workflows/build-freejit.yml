      - name: Apply app-group entitlements patch (embedded, self-contained)
        run: |
          set -eu
          # The entitlements files must ask for app groups the runtime can actually
          # reach after the signing store re-signs the app. The stock files ask for
          # groups that only work for the original upstream team's own signing,
          # LiveProcess Release asks for none, and the Share/Launch extensions ask
          # for none either â€” every extension shares the group the app writes into
          # (the guest launcher reads the certificate through it; the widget reads
          # its data the same way). The patch swaps them all to the build variables
          # that expand to the bare store groups (Release has no team suffix), which
          # SideStore/AltStore append their team to at install time â€” the same
          # group.com.SideStore.SideStore.<team> that LCSharedUtils probes.
          gate_files=(
            entitlements.xml
            LiveProcess/LiveProcess.entitlements
            LiveProcess/LiveProcessRelease.entitlements
            WidgetExtension/WidgetExtension.entitlements
            ShareExtension/ShareExtension.entitlements
            LaunchAppExtension/LaunchAppExtension.entitlements
          )
          for f in "${gate_files[@]}"; do
            test -f "$f" || { echo "FATAL: expected $f not found â€” upstream restructured the source; re-do the patch (kit README)"; exit 1; }
          done
          has() { grep -qF -- "$2" "$1"; }
          hardcoded=0; variables=0
          if has entitlements.xml 'group.com.SideStore.SideStore.2V7F92VA47'; then
            hardcoded=1
          fi
          if has entitlements.xml 'APP_GROUP_SIDESTORE' \
             && has LiveProcess/LiveProcessRelease.entitlements 'APP_GROUP_SIDESTORE' \
             && has WidgetExtension/WidgetExtension.entitlements 'APP_GROUP_SIDESTORE' \
             && has ShareExtension/ShareExtension.entitlements 'APP_GROUP_SIDESTORE' \
             && has LaunchAppExtension/LaunchAppExtension.entitlements 'APP_GROUP_SIDESTORE'; then
            variables=1
          fi
          if [ "$variables" = 1 ]; then
            echo "fork already carries the app-group entitlements fix â€” nothing to apply"
          elif [ "$hardcoded" = 1 ]; then
            cat > /tmp/appgroup-entitlements.patch <<'APPGROUP_PATCH_EOF'
          diff --git a/LiveProcess/LiveProcessRelease.entitlements b/LiveProcess/LiveProcessRelease.entitlements
          --- a/LiveProcess/LiveProcessRelease.entitlements
          +++ b/LiveProcess/LiveProcessRelease.entitlements
          @@ -13,7 +13,10 @@
           	<key>com.apple.developer.kernel.increased-memory-limit</key>
           	<true/>
           	<key>com.apple.security.application-groups</key>
          -	<array/>
          +	<array>
          +		<string>$(APP_GROUP_SIDESTORE)</string>
          +		<string>$(APP_GROUP_ALTSTORE)</string>
          +	</array>
           	<key>get-task-allow</key>
           	<true/>
           	<key>keychain-access-groups</key>
          diff --git a/WidgetExtension/WidgetExtension.entitlements b/WidgetExtension/WidgetExtension.entitlements
          --- a/WidgetExtension/WidgetExtension.entitlements
          +++ b/WidgetExtension/WidgetExtension.entitlements
          @@ -4,8 +4,8 @@
           <dict>
           	<key>com.apple.security.application-groups</key>
           	<array>
          -		<string>group.com.SideStore.SideStore.2V7F92VA47</string>
          -		<string>group.com.rileytestut.AltStore.2V7F92VA47</string>
          +		<string>$(APP_GROUP_SIDESTORE)</string>
          +		<string>$(APP_GROUP_ALTSTORE)</string>
           	</array>
           </dict>
           </plist>
          diff --git a/ShareExtension/ShareExtension.entitlements b/ShareExtension/ShareExtension.entitlements
          --- a/ShareExtension/ShareExtension.entitlements
          +++ b/ShareExtension/ShareExtension.entitlements
          @@ -3,6 +3,9 @@
           <plist version="1.0">
           <dict>
           	<key>com.apple.security.application-groups</key>
          -	<array/>
          +	<array>
          +		<string>$(APP_GROUP_SIDESTORE)</string>
          +		<string>$(APP_GROUP_ALTSTORE)</string>
          +	</array>
           </dict>
           </plist>
          diff --git a/LaunchAppExtension/LaunchAppExtension.entitlements b/LaunchAppExtension/LaunchAppExtension.entitlements
          --- a/LaunchAppExtension/LaunchAppExtension.entitlements
          +++ b/LaunchAppExtension/LaunchAppExtension.entitlements
          @@ -3,6 +3,9 @@
           <plist version="1.0">
           <dict>
           	<key>com.apple.security.application-groups</key>
          -	<array/>
          +	<array>
          +		<string>$(APP_GROUP_SIDESTORE)</string>
          +		<string>$(APP_GROUP_ALTSTORE)</string>
          +	</array>
           </dict>
           </plist>
          diff --git a/entitlements.xml b/entitlements.xml
          --- a/entitlements.xml
          +++ b/entitlements.xml
          @@ -22,8 +22,8 @@
           	<string>$(DEVELOPMENT_TEAM)</string>
           	<key>com.apple.security.application-groups</key>
           	<array>
          -		<string>group.com.SideStore.SideStore.2V7F92VA47</string>
          -		<string>group.com.rileytestut.AltStore.2V7F92VA47</string>
          +		<string>$(APP_GROUP_SIDESTORE)</string>
          +		<string>$(APP_GROUP_ALTSTORE)</string>
           	</array>
           	<key>get-task-allow</key>
           	<true/>
          APPGROUP_PATCH_EOF
            git apply --check /tmp/appgroup-entitlements.patch \
              || { echo "FATAL: app-group patch no longer applies â€” upstream moved the files; re-generate it (kit README, Upgrading section)"; exit 1; }
            git apply /tmp/appgroup-entitlements.patch
            echo "app-group entitlements patch applied"
          else
            echo "FATAL: entitlements in an unrecognized state (no hardcoded upstream-team groups, no variables) â€” re-do the patch (kit README)"; exit 1
          fi
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Two constraints meet here, and 27.1 satisfies both:
          # 1. >= Xcode 27.0: the vendored StikJIT.xcframework's Swift interface
          #    was emitted by Swift 6.4.0.34.1 â€” Xcode 27.0/27.1 both carry
          #    exactly that compiler (27.2 carries 6.4.2, also compatible).
          # 2. >= Xcode 27.1: the iPhone Duo code (LCGuestSideBar.m and four
          #    other files) uses API_AVAILABLE(ios(27.1)) symbols such as
          #    UIVerticalBarEdge, which only the iOS 27.1 SDK declares.
          #    Xcode 27.0's iOS 27.0 SDK fails with "use of undeclared
          #    identifier 'UIVerticalBarEdge'".
          # 27.1 (27A9275) is also this image's default Xcode.
          xcode-version: "27.1"

      - name: Build ad-hoc-signed archive (no Apple Developer account needed)
        run: |
          set -o pipefail
          # Log to a file so failures can be tailed in full below: xcodebuild's
          # own error output is far longer than what any pretty printer shows.
          # GitHub runs this with bash -e, so the exit code is captured with
          # `|| status=$?` â€” a bare failing command would abort before the
          # tail code below could run.
          #
          # Signing is AD-HOC (identity "-"), not disabled. A build with
          # CODE_SIGNING_ALLOWED=NO produces a binary with no entitlements
          # at all; a sideload store reads entitlements from the IPA's code
          # signature, finds none, and provisions no app groups â€” so the
          # app-group defaults suites resolve to "Unknown" in every process
          # and the UI and the guest launcher end up writing/reading
          # different private domains (the certificate import "works" in
          # Settings but the launch gate never sees it). Ad-hoc signing
          # embeds the entitlements from the patched .entitlements files;
          # the store re-signs over them with its own profile, keeping the
          # app groups the runtime probes.
          status=0
          xcodebuild clean archive \
            -project "LiveContainer.xcodeproj" \
            -scheme "LiveContainer" \
            -configuration Release \
            -archivePath $PWD/build/FlekDeck.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES \
            > build.log 2>&1 || status=$?
          # Pretty-print the log tail for the web UI (xcbeautify ships on the
          # xcode-27 image; fall back through xcpretty to a plain cat).
          if command -v xcbeautify >/dev/null 2>&1; then
            tail -n 400 build.log | xcbeautify || tail -n 400 build.log
          elif command -v xcpretty >/dev/null 2>&1; then
            tail -n 400 build.log | xcpretty || tail -n 400 build.log
          else
            tail -n 400 build.log
          fi
          if [ "$status" -ne 0 ]; then
            echo "=== xcodebuild failed (exit $status) â€” last 120 lines of build.log ==="
            tail -n 120 build.log
            exit 1
          fi
          test -d build/FlekDeck.xcarchive/Products/Applications/FlekDeck.app \
            || { echo "archive missing FlekDeck.app â€” build failed"; exit 1; }

      - name: Sign IPA entitlements in a store-readable form (ldid)
        run: |
          set -eu
          # The sideload store reads an app's entitlements from the code
          # signature of the IPA (XML plist in the entitlements slot) to decide
          # which entitlements â€” including app groups â€” to provision with your
          # Apple ID. What xcodebuild's own ad-hoc pass leaves in that slot is
          # not reliably the form the store parses: an entitlements blob the
          # store cannot decode reads as "the app asks for nothing", the store
          # then re-signs with no application-groups at all, and every
          # app-group defaults suite resolves to "Unknown" â€” the certificate
          # import appears to work, but the guest-launch gate never sees it.
          # This pass re-signs every entitlement-bearing binary with ldid,
          # which writes exactly the XML plist the store parses. The store
          # re-signs over these at install; what matters is that it can READ
          # them, and that they ask for the groups its runtime probes.
          brew install ldid
          cd build/FlekDeck.xcarchive/Products/Applications
          APP=FlekDeck.app
          # The full entitlement set the app asks for, as a plain XML plist:
          # the store groups (SideStore/AltStore append your Apple ID's team
          # suffix at install, producing exactly the group.com.SideStore.
          # SideStore.<team> the runtime probes), the keychain access groups
          # (the 128 com.kdt.livecontainer.shared* groups FlekDeck's guest
          # containers share keychain items under â€” SecItem.m's hooks and the
          # diagnostics "keychain-access-groups Correct" row read them from
          # exactly here), the team identifier, and get-task-allow. The
          # AppIdentifierPrefix form â€” no team prefix baked in â€” is what
          # upstream ships in every entitlements file and what both signers
          # rewrite to <TeamID>.<suffix> at install (SideSign
          # CodeSignerAPI.swift / AltStore ALTSigner.mm do precisely this).
          # ldid -S REPLACES the whole entitlements dict, so this plist must
          # carry everything the app means to keep â€” the v4 revision embedded
          # the groups alone and the installed app then declared no keychain
          # groups at all, which is exactly the red
          # "keychain-access-groups Correct: No" row on the diagnostics page.
          cat > /tmp/groups.plist <<'GROUPS_PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>com.apple.developer.kernel.increased-memory-limit</key>
          	<true/>
          	<key>com.apple.developer.team-identifier</key>
          	<string>$(DEVELOPMENT_TEAM)</string>
          	<key>com.apple.security.application-groups</key>
          	<array>
          		<string>group.com.SideStore.SideStore</string>
          		<string>group.com.rileytestut.AltStore</string>
          	</array>
          	<key>get-task-allow</key>
          	<true/>
          	<key>keychain-access-groups</key>
          	<array>
          GROUPS_PLIST_EOF
          for i in $(seq 0 127); do
            if [ "$i" = 0 ]; then
              echo "		<string>\$(AppIdentifierPrefix)com.kdt.livecontainer.shared</string>" >> /tmp/groups.plist
            else
              echo "		<string>\$(AppIdentifierPrefix)com.kdt.livecontainer.shared.$i</string>" >> /tmp/groups.plist
            fi
          done
          cat >> /tmp/groups.plist <<'GROUPS_PLIST_EOF'
          	</array>
          </dict>
          </plist>
          GROUPS_PLIST_EOF
          # The app binary and every appex that shares the group: LiveProcess
          # (guest launcher), WidgetExtension, ShareExtension,
          # LaunchAppExtension. LoopbackVPN asks for a network-extension
          # entitlement a free Apple ID cannot be granted, so it keeps its own
          # entitlements â€” the store drops that key when signing and the
          # built-in VPN falls back to LocalDevVPN, as designed.
          ldid -S/tmp/groups.plist "$APP/FlekDeck"
          for appex in LiveProcess WidgetExtension ShareExtension LaunchAppExtension; do
            BIN="$APP/PlugIns/$appex.appex/$appex"
            test -f "$BIN" || { echo "FATAL: $BIN missing â€” extension layout changed; update the sign step"; exit 1; }
            ldid -S/tmp/groups.plist "$BIN"
          done
          cat > /tmp/vpn.plist <<'VPN_PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>com.apple.developer.networking.networkextension</key>
          	<array>
          		<string>packet-tunnel-provider</string>
          	</array>
          </dict>
          </plist>
          VPN_PLIST_EOF
          VPN_BIN="$APP/PlugIns/LoopbackVPN.appex/LoopbackVPN"
          test -f "$VPN_BIN" || { echo "FATAL: $VPN_BIN missing â€” extension layout changed; update the sign step"; exit 1; }
          ldid -S/tmp/vpn.plist "$VPN_BIN"
          # Frameworks and dylibs carry no entitlements of their own; ldid
          # signs them ad-hoc so the store accepts the bundle. -perm -111 is
          # the portable "any execute bit" form (GNU and BSD find agree).
          find "$APP" -name '*.framework' -type d | while read -r fw; do
            BIN=$(find "$fw" -type f -perm -111 2>/dev/null | head -1)
            test -z "$BIN" || ldid -S "$BIN"
          done || true
          for dy in $(find "$APP" -name '*.dylib' -type f); do
            ldid -S "$dy"
          done
          # Self-verification: decode the entitlements slot ourselves and
          # require the full v5 set to be present as literal XML, so a silent
          # regression in the sign step fails the build instead of shipping
          # an IPA the store reads as "asks for nothing" â€” or one that asks
          # for no keychain groups, which is the v4 red row.
          check() {
            BIN="$1"
            OUT=$(ldid -e "$BIN" 2>/dev/null || true)
            if ! printf '%s' "$OUT" | grep -q 'com.apple.security.application-groups'; then
              echo "FATAL: $BIN entitlements slot carries no application-groups"; exit 1
            fi
            printf '%s' "$OUT" | grep -q 'group.com.SideStore.SideStore' \
              || { echo "FATAL: $BIN entitlements miss the SideStore group"; exit 1; }
            if ! printf '%s' "$OUT" | grep -q 'keychain-access-groups'; then
              echo "FATAL: $BIN entitlements slot carries no keychain-access-groups"; exit 1
            fi
            # every shared group, base and .1-.127, exactly what the runtime
            # (SecItem.m hooks, the diagnostics row) requires after the store
            # prefixes them with the team
            MISSING=$(printf '%s' "$OUT" | grep -c 'com.kdt.livecontainer.shared' || true)
            if [ "${MISSING:-0}" -lt 128 ]; then
              echo "FATAL: $BIN entitlements carry only $MISSING/128 keychain groups"; exit 1
            fi
            printf '%s' "$OUT" | grep -q 'get-task-allow' \
              || { echo "FATAL: $BIN entitlements miss get-task-allow"; exit 1; }
          }
          check "$APP/FlekDeck"
          for appex in LiveProcess WidgetExtension ShareExtension LaunchAppExtension; do
            check "$APP/PlugIns/$appex.appex/$appex"
          done
          echo "--- app entitlements as signed (ldid) ---"
          ldid -e "$APP/FlekDeck"
          echo "--- verification passed: all group-bearing binaries ask for the store groups AND the 128 keychain groups ---"

      - name: Package IPA (ldid-signed, store re-signs it on install)
        run: |
          mkdir -p build/Payload
          cp -R build/FlekDeck.xcarchive/Products/Applications/FlekDeck.app build/Payload/
          # Stamp the kit revision into the app version so a build can be told
          # apart from an older one at a glance: iOS Settings > FlekDeck (or any
          # About line) shows 0.3.0+cert5 only on a build carrying the v5
          # keychain-entitlements fix. The same stamp is echoed into the
          # run log, so the run log says which revision a build is.
          BUILD_STAMP="+cert5"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Payload/FlekDeck.app/Info.plist)$BUILD_STAMP" build/Payload/FlekDeck.app/Info.plist
          echo "built with kit revision v5: certificate callback + app-group entitlements + keychain-access-groups in the store-readable ldid entitlements â€” version stamp $BUILD_STAMP"
          cd build
          zip -qry FlekDeck-freejit-ldid.ipa Payload -x "._*" ".DS_Store" "__MACOSX*"
          ls -lh FlekDeck-freejit-ldid.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-freejit-ldid-ipa
          path: build/FlekDeck-freejit-ldid.ipa
          retention-days: 30

      - name: Summary
        run: |
          echo "### Build done" >> $GITHUB_STEP_SUMMARY
          echo "This build is kit revision **v5** (version stamp: 0.3.0+cert5): certificate callback fix + app-group entitlements for the app AND every extension + keychain-access-groups (the 128 shared groups the guest containers use) in the ldid entitlements the store parses. On anything older the certificate import cannot stick or the diagnostics page shows `keychain-access-groups Correct: No` â€” reinstall from this artifact." >> $GITHUB_STEP_SUMMARY
          echo "Install this IPA through SideStore/AltStore (it re-signs it with your account and provisions the app groups). Delete the old FlekDeck install first if the diagnostics page shows App Group ID: Unknown." >> $GITHUB_STEP_SUMMARY
