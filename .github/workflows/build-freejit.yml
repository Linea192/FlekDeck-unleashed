name: Build FlekDeck (free built-in JIT + SideStore certificate)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    # FlekDeck vendors StikJIT.xcframework, whose Swift interface was emitted
    # by Xcode 27's Swift 6.4 compiler (swiftlang-6.4.0.34.1). Older
    # toolchains cannot even parse it: Xcode 16.4 (Swift 6.1) dies with
    # "failed to build module 'StikJIT'; this SDK is not supported by the
    # compiler", and Xcode 26.x (Swift 6.3) is likewise too old. GitHub
    # ships Xcode 27 only on this preview image — macos-15 tops out at
    # 26.3 and macos-26 at 26.6. The iPhone Duo sources (LCGuestSideBar.m
    # and others) additionally need the iOS 27.1 SDK, so Xcode is pinned
    # to 27.1 below — Swift 6.4.0.34.1, the framework's exact compiler.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Apply free-JIT patch (embedded, self-contained)
        run: |
          set -eu
          # Self-contained: the patch is embedded below and written to /tmp at run
          # time, so your fork does NOT need a patches/ directory. If your fork
          # already carries the free-JIT changes in its source, nothing is applied.
          # If the source is in an unrecognized state (upstream moved things), the
          # step fails loudly instead of risking a half-patched build.
          gate_files=(
            LiveContainer/LCBootstrap.m
            LiveContainerSwiftUI/FlekDeck/Settings/FlekJITSetup.swift
            LiveContainerSwiftUI/FlekDeck/Settings/FlekBuiltInJITSection.swift
          )
          for f in "${gate_files[@]}"; do
            test -f "$f" || { echo "FATAL: expected $f not found — upstream restructured the source; re-do the patch (kit README)"; exit 1; }
          done
          has() { grep -qF -- "$2" "$1"; }
          gated=0; patched=0
          if has LiveContainer/LCBootstrap.m 'FlekJIT needs Premium' \
             || has LiveContainerSwiftUI/FlekDeck/Settings/FlekJITSetup.swift 'try await ensurePremium()' \
             || has LiveContainerSwiftUI/FlekDeck/Settings/FlekBuiltInJITSection.swift 'isPremium = FlekPremium.isActive'; then
            gated=1
          fi
          if has LiveContainer/LCBootstrap.m 'Built-in JIT is a Premium feature upstream'; then
            patched=1
          fi
          if [ "$gated" = 1 ] && [ "$patched" = 1 ]; then
            echo "FATAL: mixed state — some Premium gates remain while fork patch markers are present; sort the source out and re-run"; exit 1
          fi
          if [ "$gated" = 1 ]; then
            cat > /tmp/free-jit.patch <<'FREE_JIT_PATCH_EOF'
          diff --git a/LiveContainer/LCBootstrap.m b/LiveContainer/LCBootstrap.m
          index 78ab71d..ff65889 100644
          --- a/LiveContainer/LCBootstrap.m
          +++ b/LiveContainer/LCBootstrap.m
          @@ -251,22 +251,8 @@ static void LCWatchForJITHelperDone(void) {
           }
           
           static NSString *enableJITWithStikJIT(NSString *docPath) {
          -    // Built-in JIT is a Premium feature: the app says how long Premium lasts,
          -    // or that it has just confirmed it for this launch. The app asks the same
          -    // before a launch from the home screen, but not every launch starts
          -    // there — a link opened in another guest leads straight here. Ahead of
          -    // everything else, so that a launch that is refused sets nothing up and
          -    // is told why, whatever else it lacks.
          -    {
          -        NSUserDefaults *shared = NSUserDefaults.lcSharedDefaults;
          -        NSTimeInterval clock = NSDate.date.timeIntervalSince1970;
          -        // The latest the clock has been seen at stands in for one wound back.
          -        NSTimeInterval now = MAX(clock, [shared doubleForKey:@"FSAccessClockHighWaterMark"]);
          -        BOOL justConfirmed = fabs(clock - [shared doubleForKey:@"FlekPremiumConfirmedAt"]) < 60;
          -        if (!justConfirmed && [shared doubleForKey:@"FlekPremiumUntil"] <= now) {
          -            return @"FlekJIT needs Premium. Open FlekDeck to renew Premium, or choose StikDebug in Settings › JIT, which is free.";
          -        }
          -    }
          +    // Built-in JIT is a Premium feature upstream; this fork build removes the
          +    // subscription gate so the built-in enabler works without Premium.
           
               __block NSError *error;
               NSExtension *ext = [NSExtension extensionWithIdentifier:LCSharedUtils.liveProcessBundleIdentifier error:&error];
          diff --git a/LiveContainerSwiftUI/FlekDeck/Settings/FlekBuiltInJITSection.swift b/LiveContainerSwiftUI/FlekDeck/Settings/FlekBuiltInJITSection.swift
          index 9925c1f..37aae13 100644
          --- a/LiveContainerSwiftUI/FlekDeck/Settings/FlekBuiltInJITSection.swift
          +++ b/LiveContainerSwiftUI/FlekDeck/Settings/FlekBuiltInJITSection.swift
          @@ -52,8 +52,9 @@ struct FlekBuiltInJITSection: View {
               /// this reads a file.
               @State private var pairingMadeOnDevice = false
               /// By what is kept, from the start, so that the steps are not preceded by
          -    /// a glimpse of the offer.
          -    @State private var isPremium = FlekPremium.isActive
          +    /// a glimpse of the offer. Always true in this fork build: built-in JIT
          +    /// is free here.
          +    @State private var isPremium = true
               /// While the server is asked about Premium.
               @State private var isCheckingPremium = false
               @State private var showsPremiumSheet = false
          @@ -146,7 +147,7 @@ struct FlekBuiltInJITSection: View {
                           // be applied to every row, and so run once per row.
                           .onAppear {
                               pairingMadeOnDevice = FlekBuiltInJIT.isPairingFileMadeOnDevice
          -                    isPremium = FlekPremium.isActive
          +                    isPremium = true
                               if readiness == .unchecked, readyAt > 0, pairingFileFound {
                                   readiness = .ready
                               }
          @@ -304,28 +305,12 @@ struct FlekBuiltInJITSection: View {
                   .padding(.vertical, 2)
               }
           
          -    /// Runs `proceed` once Premium is settled, with the server where nothing
          -    /// kept says yes: it may have been got a moment ago. Without Premium the
          -    /// offer takes the steps' place, and says how to get it.
          +    /// Runs `proceed` once Premium is settled — which in this fork build it
          +    /// always is: built-in JIT is free here, so no confirmation is asked for
          +    /// and nothing takes the steps' place.
               private func withPremium(_ proceed: @escaping () -> Void) {
          -        guard !isCheckingPremium else {
          -            return
          -        }
          -        isCheckingPremium = true
          -        Task {
          -            let answer = await FlekPremium.confirm()
          -            isCheckingPremium = false
          -            switch answer {
          -            case .active:
          -                isPremium = true
          -                proceed()
          -            case .inactive:
          -                isPremium = false
          -                showsPremiumSheet = true
          -            case .unconfirmed:
          -                show("lc.flek.jit.premium.unconfirmed".loc)
          -            }
          -        }
          +        isPremium = true
          +        proceed()
               }
           
               // MARK: 1. Pairing file
          @@ -493,16 +478,10 @@ struct FlekBuiltInJITSection: View {
                   }
               }
           
          -    /// What is kept about Premium, and the server's word where that says no,
          -    /// unless nothing here could be used with it either.
          +    /// What is kept about Premium — always active in this fork build, where
          +    /// built-in JIT is free, so the server is never asked from here.
               private func refreshPremium() async {
          -        isPremium = FlekPremium.isActive
          -        guard !isPremium, FlekBuiltInJIT.blocker == nil else {
          -            return
          -        }
          -        if await FlekPremium.refresh() == true {
          -            isPremium = true
          -        }
          +        isPremium = true
               }
           
               /// A pairing file is a property list whatever it is called; iloader and
          diff --git a/LiveContainerSwiftUI/FlekDeck/Settings/FlekJITSetup.swift b/LiveContainerSwiftUI/FlekDeck/Settings/FlekJITSetup.swift
          index ea48707..8e842c3 100644
          --- a/LiveContainerSwiftUI/FlekDeck/Settings/FlekJITSetup.swift
          +++ b/LiveContainerSwiftUI/FlekDeck/Settings/FlekJITSetup.swift
          @@ -277,9 +277,8 @@ enum FlekJITSetup {
                   }
                   // Only of a setup there is: one never started is still the invitation
                   // to start, and what that takes is said where it is started.
          -        if !FlekPremium.isActive {
          -            return .needsPremium
          -        }
          +        // (Upstream returns .needsPremium without Premium; this fork build
          +        // treats built-in JIT as free.)
                   let steps = [
                       hasFile,
                       // Another app's VPN where FlekDeck has none, and not to be seen.
          @@ -323,8 +322,10 @@ enum FlekJITSetup {
                   if let blocker = FlekBuiltInJIT.blocker {
                       throw NotReady(message: blocker)
                   }
          -        // Ahead of the setup: without Premium there is none to send anyone to.
          -        try await ensurePremium()
          +        // Premium gate removed in this fork build: built-in JIT is free here.
          +        // Still publish the (empty) state so a guest starting on its own has
          +        // whatever the app group holds, as upstream does.
          +        FlekPremium.publish()
                   // Another FlekDeck uses the primary one's pairing file, which it
                   // cannot see.
                   if DataManager.shared.model.multiLCStatus == 0, !FlekBuiltInJIT.hasPairingFile {
          @@ -378,20 +379,7 @@ enum FlekJITSetup {
                   NotReady(message: key.loc, messageWhileWaiting: "\(key).waiting".loc)
               }
           
          -    /// Built-in JIT is used with Premium only, at every launch and not just
          -    /// while it is being set up: Premium bought for a day would otherwise set
          -    /// up JIT for good.
          -    @MainActor
          -    private static func ensurePremium() async throws {
          -        // What a guest goes by where it starts without this having been asked.
          -        FlekPremium.publish()
          -        switch await FlekPremium.confirm() {
          -        case .active:
          -            FlekPremium.noteConfirmedForLaunch()
          -        case .inactive:
          -            throw NotReady(title: "lc.flek.jit.premium.title".loc, message: "lc.flek.jit.premium.needed".loc)
          -        case .unconfirmed:
          -            throw NotReady(title: "lc.flek.jit.premium.title".loc, message: "lc.flek.jit.premium.unconfirmed".loc)
          -        }
          -    }
          +    // ensurePremium() was removed by the free-JIT fork patch: the built-in
          +    // enabler no longer requires Premium in this build. The enum case
          +    // Standing.needsPremium is kept so FlekGeneralView still compiles.
           }
          FREE_JIT_PATCH_EOF
            git apply --check /tmp/free-jit.patch \
              || { echo "FATAL: free-jit patch no longer applies — upstream moved the code; re-generate it (kit README, Upgrading section)"; exit 1; }
            git apply /tmp/free-jit.patch
            echo "free-JIT patch applied"
          elif [ "$patched" = 1 ]; then
            echo "fork already carries the free-JIT changes — nothing to apply"
          else
            echo "FATAL: neither upstream Premium gates nor fork patch markers found — unrecognized source; re-do the patch (kit README)"; exit 1
          fi
      - name: Apply SideStore-certificate patch (embedded, self-contained)
        run: |
          set -eu
          # Self-contained: the patch is embedded below and written to /tmp at run
          # time. It wires LiveContainer's dormant SideStore-certificate engine back
          # into the Flek settings UI: a card on General that asks SideStore/AltStore
          # to hand over the free-account certificate it signed this FlekDeck with.
          # The engine itself (importCertificateFromSideStore, the keychain read, the
          # flekdeck://certificate callback) is already in the source — upstream only
          # dropped the button when the settings UI was redesigned.
          gate_files=(
            LiveContainerSwiftUI/FlekDeck/Settings/FlekGeneralView.swift
            LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
            Resources/Localizable.xcstrings
          )
          for f in "${gate_files[@]}"; do
            test -f "$f" || { echo "FATAL: expected $f not found — upstream restructured the source; re-do the patch (kit README)"; exit 1; }
          done
          has() { grep -qF -- "$2" "$1"; }
          engine=0; patched=0
          if has LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift 'func importCertificateFromSideStore()'; then
            engine=1
          fi
          if has LiveContainerSwiftUI/FlekDeck/Settings/FlekGeneralView.swift 'var onImportFromStore: (() -> Void)?'; then
            patched=1
          fi
          # The patch wires UI to the engine without touching it, so a patched tree
          # still carries the engine: engine+markers is the normal patched state,
          # and engine alone is the pristine one. Only an engine gone from a tree
          # that still has the UI markers is a mixed state — wiring with nothing to
          # wire to.
          if [ "$engine" = 0 ]; then
            echo "FATAL: the SideStore certificate engine importCertificateFromSideStore is gone from LCSettingsView — upstream restructured or removed it; re-do the patch (kit README)"; exit 1
          fi
          if [ "$patched" = 1 ]; then
            echo "fork already carries the SideStore certificate card — nothing to apply"
          else
            cat > /tmp/sidestore-cert.patch <<'SIDESTORE_CERT_PATCH_EOF'
          diff --git a/LiveContainerSwiftUI/FlekDeck/Settings/FlekGeneralView.swift b/LiveContainerSwiftUI/FlekDeck/Settings/FlekGeneralView.swift
          index 2f176d1..818762f 100644
          --- a/LiveContainerSwiftUI/FlekDeck/Settings/FlekGeneralView.swift
          +++ b/LiveContainerSwiftUI/FlekDeck/Settings/FlekGeneralView.swift
          @@ -48,6 +48,11 @@ struct FlekGeneralView<JITPage: View>: View {
               let managesCertificate: Bool
               /// Forgets the stored certificate. The page asks first.
               let onRemoveCertificate: () -> Void
          +    /// Asks the store that installed this FlekDeck — SideStore or AltStore —
          +    /// to hand over the free-account certificate it keeps, the way
          +    /// LiveContainer takes one. Nil where there is no store to ask, and the
          +    /// row for it is hidden.
          +    var onImportFromStore: (() -> Void)? = nil
               /// Where "Set Up JIT" leads: the JIT category's own page.
               @ViewBuilder let jitPage: () -> JITPage
           
          @@ -159,6 +164,9 @@ struct FlekGeneralView<JITPage: View>: View {
                               setupCard
                           }
                           certificateCard
          +                if showsImportFromStore {
          +                    importFromStoreCard
          +                }
                           NavigationLink {
                               jitPage()
                           } label: {
          @@ -407,6 +415,59 @@ struct FlekGeneralView<JITPage: View>: View {
                   }
               }
           
          +    /// The store that installed this FlekDeck, where that was SideStore or
          +    /// AltStore — the two that keep the certificate a free Apple ID signed
          +    /// this FlekDeck with, which the card below asks them to hand over.
          +    /// Nil for any other installer, and the card is hidden.
          +    private var importStoreName: String? {
          +        switch LCUtils.store() {
          +        case .SideStore: return "SideStore"
          +        case .AltStore: return "AltStore"
          +        default: return nil
          +        }
          +    }
          +
          +    /// Whether the card that asks the store can be shown: there is one to ask,
          +    /// this copy manages its own certificate, and this build can use one at
          +    /// all. LiveContainer shows the same row wherever its store check passes;
          +    /// the last condition is FlekDeck's own, since a build that cannot sign
          +    /// has no use for what the store would hand back.
          +    private var showsImportFromStore: Bool {
          +        onImportFromStore != nil && importStoreName != nil
          +            && managesCertificate && LCProvisioningProfile.isAppDevelopmentSigned
          +    }
          +
          +    /// Asking the store that installed this FlekDeck for the certificate it
          +    /// keeps, rather than exporting a .p12 by hand. It appears beside the
          +    /// import page's card — both ways are open — and again once a certificate
          +    /// is imported, as the refresh it is then: a store's certificate runs
          +    /// out with the sideload's week, and the store's own refresh hands back
          +    /// one valid again.
          +    ///
          +    /// The engine is LiveContainer's own, left over from FlekDeck's fork of
          +    /// it: a build-in SideStore is read from the keychain directly, and any
          +    /// SideStore or AltStore is asked through its URL scheme, handing the
          +    /// certificate back through the flekdeck://certificate link this app
          +    /// already opens.
          +    private var importFromStoreCard: some View {
          +        let storeName = importStoreName ?? ""
          +        return Button {
          +            onImportFromStore?()
          +        } label: {
          +            FlekSetupOption(
          +                icon: .symbol("arrow.down.circle.fill", .green),
          +                title: (sharedModel.isCertificateImported
          +                        ? "lc.settings.refreshCertificateFromStore %@"
          +                        : "lc.settings.importCertificateFromStore %@").localizeWithFormat(storeName),
          +                subtitle: "lc.flek.certImport.store.desc %@".localizeWithFormat(storeName),
          +                tray: {
          +                    FlekSetupPoints(points: ["lc.flek.certImport.store.point1".loc])
          +                }
          +            )
          +        }
          +        .buttonStyle(FlekCardPressStyle())
          +    }
          +
               private func certificateOption<Tray: View>(
                   isDimmed: Bool = false,
                   showsChevron: Bool = false,
          diff --git a/LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift b/LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          index bbddee7..f18830e 100644
          --- a/LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          +++ b/LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          @@ -857,6 +857,10 @@ struct LCSettingsView: View {
                   FlekGeneralView(
                       managesCertificate: sharedModel.multiLCStatus != 2,
                       onRemoveCertificate: { clearCertificate() },
          +            // SideStore and AltStore only: the engine importCertificateFromSideStore,
          +            // carried over from LiveContainer. A copy installed any other way has
          +            // no store to ask, and the card stays hidden.
          +            onImportFromStore: store == .SideStore || store == .AltStore ? { Task { await importCertificateFromSideStore() } } : nil,
                       jitPage: { jitPage }
                   )
                   .navigationBarTitleDisplayMode(.inline)
          diff --git a/Resources/Localizable.xcstrings b/Resources/Localizable.xcstrings
          index bd77146..c66e943 100644
          --- a/Resources/Localizable.xcstrings
          +++ b/Resources/Localizable.xcstrings
          @@ -16373,6 +16373,28 @@
                   }
                 }
               },
          +    "lc.flek.certImport.store.desc %@" : {
          +      "extractionState" : "manual",
          +      "localizations" : {
          +        "en" : {
          +          "stringUnit" : {
          +            "state" : "translated",
          +            "value" : "Takes the free-account certificate %@ signed this FlekDeck with, so there is nothing to export by hand."
          +          }
          +        }
          +      }
          +    },
          +    "lc.flek.certImport.store.point1" : {
          +      "extractionState" : "manual",
          +      "localizations" : {
          +        "en" : {
          +          "stringUnit" : {
          +            "state" : "translated",
          +            "value" : "LiveContainer's own flow, carried over by the fork"
          +          }
          +        }
          +      }
          +    },
               "lc.flek.certImport.warning" : {
                 "extractionState" : "manual",
                 "localizations" : {
          SIDESTORE_CERT_PATCH_EOF
            git apply --check /tmp/sidestore-cert.patch \
              || { echo "FATAL: sidestore-cert patch no longer applies — upstream moved the code; re-generate it (kit README, Upgrading section)"; exit 1; }
            git apply /tmp/sidestore-cert.patch
            echo "sidestore-cert patch applied"
          fi
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Two constraints meet here, and 27.1 satisfies both:
          # 1. >= Xcode 27.0: the vendored StikJIT.xcframework's Swift interface
          #    was emitted by Swift 6.4.0.34.1 — Xcode 27.0/27.1 both carry
          #    exactly that compiler (27.2 carries 6.4.2, also compatible).
          # 2. >= Xcode 27.1: the iPhone Duo code (LCGuestSideBar.m and four
          #    other files) uses API_AVAILABLE(ios(27.1)) symbols such as
          #    UIVerticalBarEdge, which only the iOS 27.1 SDK declares.
          #    Xcode 27.0's iOS 27.0 SDK fails with "use of undeclared
          #    identifier 'UIVerticalBarEdge'".
          # 27.1 (27A9275) is also this image's default Xcode.
          xcode-version: "27.1"

      - name: Build unsigned archive (no Apple Developer account needed)
        run: |
          set -o pipefail
          # Log to a file so failures can be tailed in full below: xcodebuild's
          # own error output is far longer than what any pretty printer shows.
          # GitHub runs this with bash -e, so the exit code is captured with
          # `|| status=$?` — a bare failing command would abort before the
          # tail code below could run.
          status=0
          xcodebuild clean archive \
            -project "LiveContainer.xcodeproj" \
            -scheme "LiveContainer" \
            -configuration Release \
            -archivePath $PWD/build/FlekDeck.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || status=$?
          # Pretty-print the log tail for the web UI (xcbeautify ships on the
          # xcode-27 image; fall back through xcpretty to a plain cat).
          if command -v xcbeautify >/dev/null 2>&1; then
            tail -n 400 build.log | xcbeautify || tail -n 400 build.log
          elif command -v xcpretty >/dev/null 2>&1; then
            tail -n 400 build.log | xcpretty || tail -n 400 build.log
          else
            tail -n 400 build.log
          fi
          if [ "$status" -ne 0 ]; then
            echo "=== xcodebuild failed (exit $status) — last 120 lines of build.log ==="
            tail -n 120 build.log
            exit 1
          fi
          test -d build/FlekDeck.xcarchive/Products/Applications/FlekDeck.app \
            || { echo "archive missing FlekDeck.app — build failed"; exit 1; }

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/FlekDeck.xcarchive/Products/Applications/FlekDeck.app build/Payload/
          cd build
          zip -qry FlekDeck-freejit-unsigned.ipa Payload -x "._*" ".DS_Store" "__MACOSX*"
          ls -lh FlekDeck-freejit-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-freejit-unsigned-ipa
          path: build/FlekDeck-freejit-unsigned.ipa
          retention-days: 30

      - name: Summary
        run: |
          echo "### Build done" >> $GITHUB_STEP_SUMMARY
          echo "Download the unsigned IPA from this run's Artifacts, then sign it locally (see README)." >> $GITHUB_STEP_SUMMARY
